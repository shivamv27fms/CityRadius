<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta
      name="description"
      content="CityRadius helps you discover, compare and review cafes, PGs, libraries, coworking spaces and everyday places across Delhi NCR."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://www.cityradius.in/" />
    <meta property="og:title" content="CityRadius — Find your place in Delhi NCR" />
    <meta
      property="og:description"
      content="Local places, live maps and honest community reviews for Delhi, Gurugram and Noida."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.cityradius.in/" />
    <meta property="og:site_name" content="CityRadius" />
    <meta property="og:image" content="https://www.cityradius.in/og.png" />
    <meta property="og:image:width" content="1733" />
    <meta property="og:image:height" content="910" />
    <meta property="og:image:alt" content="CityRadius — Find your place in Delhi NCR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CityRadius — Find your place in Delhi NCR" />
    <meta
      name="twitter:description"
      content="Local places, live maps and honest community reviews for Delhi, Gurugram and Noida."
    />
    <meta name="twitter:image" content="https://www.cityradius.in/og.png" />
    <meta name="twitter:image:alt" content="CityRadius — Find your place in Delhi NCR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <title>CityRadius — Find your place in Delhi NCR</title>
    <script id="cityradius-seo-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CityRadius",
        "url": "https://www.cityradius.in/",
        "description": "Discover, compare and review cafes, PGs, libraries, coworking spaces and useful places across Delhi NCR.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.cityradius.in/explore?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/cityradius-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
